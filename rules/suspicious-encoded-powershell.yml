title: Suspicious Encoded PowerShell Execution
id: 3baf3b88-824a-4e09-a87f-111111111111
status: experimental
description: Detects PowerShell execution using encoded command arguments.
author: Vincen Sanjaya
date: 2026-10-07

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'

  selection_command:
    CommandLine|contains:
      - ' -enc '
      - ' -EncodedCommand '

  condition: selection_image and selection_command

falsepositives:
  - Legitimate administrative scripts using encoded PowerShell

level: high

tags:
  - attack.execution
  - attack.t1059.001
  - attack.t1027