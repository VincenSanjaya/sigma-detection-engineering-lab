title: Suspicious Rundll32 Execution
id: 8af2cc91-b14d-4c61-8fa4-444444444444
status: experimental
description: Detects suspicious rundll32.exe execution patterns commonly associated with proxy execution or script abuse.
author: Vincen Sanjaya
date: 2026-10-07

logsource:
  category: process_creation
  product: windows

detection:
  selection_image:
    Image|endswith: '\rundll32.exe'

  selection_suspicious:
    CommandLine|contains:
      - "javascript:"
      - "vbscript:"
      - "http://"
      - "https://"
      - "shell32.dll,Control_RunDLL"

  condition: selection_image and selection_suspicious

falsepositives:
  - Legitimate Control Panel activity
  - Administrative scripts using rundll32

level: high

tags:
  - attack.t1218.011
